<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Fonts are loaded dynamically by theme-engine.js based on user selection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="lincle-gfont-inter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
  <style>
    :root {
      --bg:          #000000;
      --surface:     #252525;
      --surface2:    #1a1a1a;
      --border:      #333333;
      --primary:     #ffffff;
      --primary-dim: rgba(255,255,255,0.08);
      --primary-glow:rgba(255,255,255,0.12);
      --green:       #ffffff;
      --green-dim:   rgba(255,255,255,0.06);
      --red:         #666666;
      --red-dim:     rgba(102,102,102,0.10);
      --text:        #ffffff;
      --text-dim:    #777777;

      /* Metalab radii */
      --radius:      50px;
      --radius-sm:   50px;
      --radius-pill: 1000px;

      /* Fonts — overridden at runtime by theme-engine lincleApplyFont() */
      --font-display: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body:    'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      user-select: none;
      letter-spacing: -0.01em;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 40px; height: 40px; border-radius: var(--radius);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .logo-icon svg { color: var(--text); }
    .logo-text {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 300;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 0.9;
    }
    .logo-sub {
      font-family: var(--font-body);
      font-size: 10px; font-weight: 300;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .header-actions { display: flex; gap: 6px; }

    /* ── Icon button ── */
    .icon-btn {
      width: 32px; height: 32px; border-radius: var(--radius);
      background: transparent; border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      transition: all .2s ease;
    }
    .icon-btn svg { display: block; flex-shrink: 0; }
    .icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--text-dim); }
    .icon-btn:active { transform: scale(0.94); }

    /* ── Toggle switch ── */
    .switch { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: absolute; inset: 0; background: var(--border);
      border-radius: var(--radius-pill); cursor: pointer; transition: background .25s ease;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-dim); top: 3px; left: 3px;
      transition: transform .25s ease, background .25s ease;
    }
    input:checked + .slider { background: var(--text); }
    input:checked + .slider::before { transform: translateX(18px); background: var(--bg); }

    /* ── Shield card ── */
    .shield-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 16px;
      transition: background .3s ease;
    }
    .shield-icon-wrap {
      width: 48px; height: 48px; border-radius: var(--radius); flex-shrink: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--text); transition: all .3s ease;
    }
    .shield-icon-wrap.off { color: var(--text-dim); }
    .shield-info { flex: 1; min-width: 0; }
    .shield-label {
      font-size: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 300;
      font-family: var(--font-body);
    }
    .shield-status {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 300; color: var(--text);
      margin: 2px 0; display: flex; align-items: center; gap: 8px;
      letter-spacing: -0.02em;
    }
    .shield-status.off { color: var(--text-dim); }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text); flex-shrink: 0;
      animation: pulse 2.5s ease infinite;
    }
    .status-dot.off { background: var(--text-dim); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .shield-version {
      font-size: 10px; color: var(--text-dim);
      font-weight: 300; letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Toggle rows ── */
    .toggles { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .toggle-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer; transition: background .2s ease;
    }
    .toggle-row:hover { background: var(--surface2); }
    .toggle-row svg { color: var(--text-dim); flex-shrink: 0; }
    .toggle-info { flex: 1; min-width: 0; }
    .toggle-label {
      font-size: 13px; font-weight: 400;
      letter-spacing: -0.01em;
    }
    .toggle-hint {
      font-size: 10px; color: var(--text-dim);
      font-weight: 300; margin-top: 2px;
      letter-spacing: 0.02em;
    }

    /* ── Stats ── */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--surface);
      border-radius: var(--radius); padding: 18px 16px;
      text-align: center;
    }
    .stat-val {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 300;
      line-height: 0.9; letter-spacing: -0.03em;
      color: var(--text);
    }
    .stat-lbl {
      font-size: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 300; margin-top: 8px;
    }

    /* ── Action button ── */
    .action-btn {
      width: 100%; padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border); background: transparent;
      color: var(--text); font-family: var(--font-body);
      font-size: 13px; font-weight: 400;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      transition: all .2s ease;
      letter-spacing: -0.01em;
    }
    .action-btn:hover { background: var(--surface); border-color: var(--text-dim); }
    .action-btn:active { transform: scale(0.98); }

    /* ── Toast ── */
    #clipResult {
      margin-top: 10px; padding: 12px 16px;
      border-radius: var(--radius); font-size: 11px; font-weight: 300;
      display: none;
      background: var(--surface); color: var(--text-dim);
      word-break: break-all; line-height: 1.6;
      letter-spacing: 0.01em;
    }
    #clipResult.show { display: block; }
    #clipResult.success { color: var(--text); }
    #clipResult.error   { color: var(--text-dim); }
    #clipResult.info    { color: var(--text-dim); }

    /* ── Metadata annotation (editorial marginalia) ── */
    .meta-annotation {
      font-size: 10px; font-weight: 300;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--font-body);
    }

    /* ── Footer credits ── */
    .footer {
      margin-top: 20px; padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between;
      align-items: center;
    }
    .footer-left { font-size: 10px; color: var(--text-dim); font-weight: 300; letter-spacing: 0.06em; text-transform: uppercase; }
    .footer-right { font-size: 10px; color: var(--text-dim); font-weight: 300; letter-spacing: 0.06em; }
  </style>
</head>
<body>

  <!-- SVG sprite -->
  <div style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg"><defs>
      <symbol id="ic-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>
      </symbol>
      <symbol id="ic-shield-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
      </symbol>
      <symbol id="ic-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </symbol>
      <symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </symbol>
      <symbol id="ic-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1"/>
      </symbol>
      <symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

      </symbol>
      <symbol id="ic-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
      </symbol>
      <!-- Theme icons -->
      <symbol id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

      <symbol id="ic-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        <circle cx="17.5" cy="10.5" r="0.5" fill="currentColor" stroke="none"/>

      </symbol>
      <!-- Void theme icon -->
      <symbol id="ic-void" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3"/>

  </div>

  <!-- ── Header ── -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18"><use href="#ic-shield-check"/></svg>
      </div>
      <div>
        <div class="logo-text">Lincle</div>
        <div class="logo-sub">Link Cleaner & Ad Bypass</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggleBtn" title="Theme">
        <svg width="14" height="14" id="themeIcon"><use href="#ic-void"/></svg>
      </button>
      <button class="icon-btn" id="openOptions" title="Settings">
        <svg width="14" height="14"><use href="#ic-settings"/></svg>
      </button>
    </div>
  </div>

  <!-- ── Shield Card ── -->
  <div class="shield-card" id="shieldCard">
    <div class="shield-icon-wrap" id="shieldIconWrap">
      <svg width="22" height="22" id="shieldSvg"><use href="#ic-shield-check"/></svg>
    </div>
    <div class="shield-info">
      <div class="shield-label" data-i18n="popShield">Protection Shield</div>
      <div class="shield-status" id="shieldStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="shieldStatusText">Active</span>
      </div>
      <div class="shield-version" id="shieldVersion"></div>
    </div>
  </div>

  <!-- ── Toggles ── -->
  <div class="toggles">
    <label class="toggle-row" for="masterToggle">
      <svg width="15" height="15"><use href="#ic-power"/></svg>
      <div class="toggle-info">
        <div class="toggle-label" data-i18n="popMaster">Master Protection</div>
        <div class="toggle-hint" id="powerHint" data-i18n="popMasterHint">Toggle entire engine</div>
      </div>
      <label class="switch" style="pointer-events:none">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </label>
    <label class="toggle-row" for="shieldToggle">
      <svg width="15" height="15"><use href="#ic-shield-check"/></svg>
      <div class="toggle-info">
        <div class="toggle-label" data-i18n="popShieldToggle">Popup Shield</div>
        <div class="toggle-hint" data-i18n="popShieldHint">Bypasses overlays</div>
      </div>
      <label class="switch" style="pointer-events:none">
        <input type="checkbox" id="shieldToggle" checked>
        <span class="slider"></span>
      </label>
    </label>
  </div>

  <!-- ── Stats ── -->
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="valLinks">0</div>
      <div class="stat-lbl" data-i18n="popCleaned">Cleaned</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="valTime">0s</div>
      <div class="stat-lbl" data-i18n="popSaved">Saved</div>
    </div>
  </div>

  <!-- ── Action ── -->
  <button class="action-btn" id="cleanClipBtn">
    <svg width="14" height="14"><use href="#ic-clipboard"/></svg>
    <span data-i18n="btnCleanClip">Clean Clipboard</span>
  </button>

  <div id="clipResult"></div>

  <!-- ── Footer ── -->
  <div class="footer">
    <div class="footer-left">Nyxa48</div>
    <div class="footer-right meta-annotation" id="footerTime"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="theme-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
